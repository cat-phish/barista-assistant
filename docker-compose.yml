services:
  # Images build from the repo root: npm workspaces share one lockfile, and
  # backend/worker depend on the shared/ workspace.
  #
  # Secrets: values come from the root .env (see .env.example) but reach the
  # containers as files under /run/secrets via the `secrets:` section below,
  # not as environment variables, so they don't show up in `docker inspect`.
  # The apps read them through NAME_FILE variables (shared/src/env.ts).
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # Local only by default. To open the app to your LAN (e.g. to test on a
    # phone at http://<this machine's IP>:5173), set FRONTEND_BIND=0.0.0.0 in
    # .env. Only this port needs to face the LAN: /api goes through Vite's
    # proxy to the backend over the Docker network.
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:5173:5173"
    environment:
      - API_PROXY_TARGET=http://backend:3000
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Lets notification services on this machine (a local ntfy or Gotify) be
    # reached as http://host.docker.internal:<port>: inside the container,
    # localhost is the container itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=mysql://barista@db:3306/coffee_journal
      - DATABASE_PASSWORD_FILE=/run/secrets/db_password
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - CORS_ORIGIN=http://localhost:5173
      # Requests arrive through the frontend's dev proxy: trust it for the
      # client IP, so the login rate limit is per device.
      - TRUST_PROXY=1
      # The image defaults to production, which marks the session cookie
      # Secure (HTTPS only). This stack serves plain http://localhost.
      - NODE_ENV=development
      # false closes sign-ups (a public server); existing accounts still log in.
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      # The zone scheduled backups' hour is in (e.g. America/Los_Angeles).
      - BACKUP_TIMEZONE=${BACKUP_TIMEZONE:-UTC}
      # false keeps database dumps on the server (no downloads in the app).
      - BACKUP_DOWNLOADS=${BACKUP_DOWNLOADS:-true}
    # Lists and serves the dumps the worker writes (read-only here). Bean
    # photos (docs/api/bean-photos.md §4c) live in ./photos: back it up with
    # the database.
    volumes:
      - ./backups:/backups:ro
      - ./photos:/photos
    secrets:
      - db_password
      - redis_password
      - jwt_secret
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    # Lets notification services on this machine (a local ntfy or Gotify) be
    # reached as http://host.docker.internal:<port>: inside the container,
    # localhost is the container itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=mysql://barista@db:3306/coffee_journal
      - DATABASE_PASSWORD_FILE=/run/secrets/db_password
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
      - OPENAI_MODEL=${OPENAI_MODEL}
      # Reads bean labels from photos (docs/api/bean-label.md §4d); empty = OPENAI_MODEL.
      - OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL:-}
      # Zone for brews logged without a UTC offset (older ones); empty = UTC.
      - BREW_TIMEZONE=${BREW_TIMEZONE:-}
      # Where the app opens, for the link in rate-later reminders.
      - APP_URL=${APP_URL:-http://localhost:5173}
    # Scheduled database dumps land in ./backups (docs/api/server.md §10).
    volumes:
      - ./backups:/backups
    secrets:
      - db_password
      - redis_password
      - openai_api_key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Healthy only after its startup migrations ran, so tables exist.
      backend:
        condition: service_healthy

  db:
    image: mariadb:lts
    # Same guard as redis: an empty variable means no secret file, and MariaDB
    # must not initialize users with empty passwords.
    entrypoint:
      - sh
      - -c
      - >-
        for s in db_password db_root_password; do
        [ -s "/run/secrets/$$s" ] || { echo "$$s secret is missing or empty: set MARIADB_PASSWORD and MARIADB_ROOT_PASSWORD in .env" >&2; exit 1; };
        done;
        exec docker-entrypoint.sh mariadbd
    # Loopback only: containers reach it as db:3306 over the compose network;
    # this mapping is just for tools on this machine (npm run dev, DB clients).
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      - MARIADB_DATABASE=coffee_journal
      # The app connects as this user, which only has rights on coffee_journal.
      - MARIADB_USER=barista
      - MARIADB_PASSWORD_FILE=/run/secrets/db_password
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
      # Creates the test database on first start (see the file for details).
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    # Redis can't read its password from a file, so read the secret here and
    # hand off to the image's entrypoint (which drops to the redis user).
    # Refuse to start without it: an empty REDIS_PASSWORD makes Compose skip
    # the secret file, and `--requirepass ""` would mean NO password.
    # AOF so queued jobs survive restarts; noeviction because BullMQ breaks if
    # Redis evicts its keys under memory pressure.
    entrypoint:
      - sh
      - -c
      - >-
        pw="$$(cat /run/secrets/redis_password 2>/dev/null)";
        [ -n "$$pw" ] || { echo "redis_password secret is missing or empty: set REDIS_PASSWORD in .env" >&2; exit 1; };
        exec docker-entrypoint.sh redis-server
        --appendonly yes --maxmemory-policy noeviction
        --requirepass "$$pw"
    secrets:
      - redis_password
    # Loopback only (see db).
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # redis-cli exits 0 even on an auth error, so check for the PONG reply.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

# Each secret is read from the variable of the same (upper-case) name in .env.
secrets:
  db_root_password:
    environment: MARIADB_ROOT_PASSWORD
  db_password:
    environment: MARIADB_PASSWORD
  redis_password:
    environment: REDIS_PASSWORD
  jwt_secret:
    environment: JWT_SECRET
  openai_api_key:
    environment: OPENAI_API_KEY

volumes:
  db_data:
  redis_data:
